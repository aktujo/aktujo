# SPDX-License-Identifier: AGPL-3.0-or-later
# Format, lints and tests on Linux, macOS and Windows, also of aktujo-minimal; the web app with its types from
# api/openapi.json; api/openapi.json up to date; dependencies (cargo deny). The licence check (REUSE) and a sign-off
# (DCO) on every commit of a pull request come from falkoss/starterpack, pinned by commit. A version tag runs the
# checks again and, once they pass, publishes the core crates on crates.io (job `crates`), builds the program for each
# platform as `aktujo` and `aktujo-minimal` (job `binaries`) and puts them into a draft release (job `release`) that
# the maintainer publishes. Actions are pinned by commit, with the version as a comment.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      # Files as they are in the repository – api/openapi.json and the types are compared byte for byte.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The web app first: the binary embeds its build.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web app – install, types from api/openapi.json up to date, check, build
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm api
          git diff --exit-code src/lib/api-types.ts
          pnpm check
          pnpm build
      # OpenSSL (vendored, for SQLCipher) is configured with Perl: on Windows the native Strawberry Perl, not Git's.
      - if: runner.os == 'Windows'
        run: echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@2201cc584a476d1b508be977bbe4b7d1c7a52e9c # v2.9.3
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features
      # The store in PostgreSQL (aktujo-store, aktujo-sync): tested against the PostgreSQL the Linux runner brings.
      - if: runner.os == 'Linux'
        name: PostgreSQL for the tests
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql -c "CREATE USER aktujo PASSWORD 'aktujo'" -c "CREATE DATABASE aktujo_test OWNER aktujo"
          echo "AKTUJO_TEST_POSTGRES=postgres://aktujo:aktujo@localhost/aktujo_test" >> "$GITHUB_ENV"
      - run: cargo test --locked --all-features
      - name: aktujo-minimal – without scanning and OCR
        run: |
          cargo test --locked -p aktujo-sdk
          cargo clippy --locked -p aktujo --no-default-features
      # The SDK is MIT, for the apps (docs/rfc/0006-apps-and-sdk.md): nothing under it is under a copyleft licence.
      - name: aktujo-sdk is permissive all the way down
        run: |
          cargo tree --locked -p aktujo-sdk --all-features -e normal,build --prefix none --format '{p} {l}' | sort -u > sdk-licences.txt
          if grep -E 'GPL|MPL|EUPL|CDDL' sdk-licences.txt; then echo "::error::aktujo-sdk reaches a copyleft crate"; exit 1; fi
      - name: aktujo and aktujo-minimal share the data folder
        run: |
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=.exe
          mkdir -p editions
          cargo build --locked -p aktujo && cp "target/debug/aktujo$exe" "editions/aktujo$exe"
          cargo build --locked -p aktujo --no-default-features && cp "target/debug/aktujo$exe" "editions/aktujo-minimal$exe"
          scripts/check-editions.sh "editions/aktujo$exe" "editions/aktujo-minimal$exe"
      - name: api/openapi.json matches the code
        run: |
          cargo run --locked -q -p aktujo -- openapi > api/openapi.json
          git diff --exit-code api/openapi.json

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
  licences:
    uses: falkoss/starterpack/.github/workflows/reuse.yml@8fba58423b0b95131b436cb2edcb91adad742d71
  sign-off:
    uses: falkoss/starterpack/.github/workflows/dco.yml@8fba58423b0b95131b436cb2edcb91adad742d71

  # Every crate on crates.io – the core, the document crates, the SDK, the texts, the interfaces and the program – from
  # a tag `v0.3.1` on a commit of main, once the checks of this run passed: in the order of their dependencies, each in
  # the tag's version, through crates.io's trusted publishing (a short-lived token for this workflow and the
  # environment `crates-io`, no stored secret). A version already on crates.io is left alone, so the job can run
  # again. A crate's first version is published by hand, since trusted publishing is set up on crates.io for a crate
  # that exists. The OCR models are crates of aktujo/models, released there.
  crates:
    needs: [rust, licences]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # aktujo-web carries the web app's build (crates/aktujo-web/web), so it is built first.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          test -f ../crates/aktujo-web/web/index.html
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - name: The tag is on main and names the workspace's version
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::$GITHUB_REF_NAME is not on main: release a commit of main"; exit 1; }
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "aktujo-base") | .version')
          test "v$version" = "$GITHUB_REF_NAME" \
            || { echo "::error::the crates are $version, the tag $GITHUB_REF_NAME"; exit 1; }
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # The web app's build in crates/aktujo-web/web is built, not committed: cargo counts it as a change, so
          # aktujo-web is published with --allow-dirty – once nothing tracked has changed.
          git diff --quiet HEAD || { echo "::error::tracked files changed during the build"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          for crate in base blob log crypt store relay sync scan doc extract rules core sdk locales tui web api; do
            name="aktujo-$crate"
            if curl -fsS -A "aktujo release (https://github.com/aktujo/aktujo)" \
                 "https://crates.io/api/v1/crates/$name/$version" >/dev/null 2>&1; then
              echo "$name $version is on crates.io already"; continue
            fi
            dirty=""; [ "$name" = aktujo-web ] && dirty=--allow-dirty
            cargo publish --locked $dirty -p "$name"
          done
          if curl -fsS -A "aktujo release (https://github.com/aktujo/aktujo)" \
               "https://crates.io/api/v1/crates/aktujo/$version" >/dev/null 2>&1; then
            echo "aktujo $version is on crates.io already"
          else
            cargo publish --locked -p aktujo
          fi

  # The program for each platform, from a version tag once the checks passed: `aktujo` (everything) and
  # `aktujo-minimal` (without scanning, OCR and object stores – decision 6 of RFC 0004), each with the licence and
  # README – the platforms of falkOSS (starterpack, docs/practices.md): Linux on x86-64 and ARM64, macOS on Apple
  # silicon (Intel is never built), Windows on x64 (ARM64 once the community asks; then aktujo-minimal only for now:
  # tract's assembly does not link with MSVC there). `editions` lets a target build one of the two. OPEN: signing and
  # notarising for macOS and Windows.
  binaries:
    needs: [rust, licences]
    # Also when started by hand, to try the builds without a release.
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: linux-x86_64, editions: full minimal }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64, editions: full minimal }
          - { os: macos-latest, target: aarch64-apple-darwin, name: macos-arm64, editions: full minimal }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, name: windows-x86_64, editions: full minimal }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Web app
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      # OpenSSL (vendored, for SQLCipher) is configured with Perl: on Windows the native Strawberry Perl, not Git's.
      - if: runner.os == 'Windows'
        run: |
          [ -x C:/Strawberry/perl/bin/perl.exe ] || choco install strawberryperl --no-progress -y
          echo "OPENSSL_SRC_PERL=C:/Strawberry/perl/bin/perl.exe" >> "$GITHUB_ENV"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - name: Build aktujo and aktujo-minimal
        run: |
          exe=""; [ "${{ runner.os }}" = Windows ] && exe=.exe
          for edition in ${{ matrix.editions }}; do
            mkdir -p "out/$edition"
            if [ "$edition" = full ]; then
              cargo build --locked --release -p aktujo --target ${{ matrix.target }}
              cp "target/${{ matrix.target }}/release/aktujo$exe" "out/full/aktujo$exe"
            else
              cargo build --locked --release -p aktujo --no-default-features --target ${{ matrix.target }}
              cp "target/${{ matrix.target }}/release/aktujo$exe" "out/minimal/aktujo-minimal$exe"
            fi
          done
      - name: Pack, with the licence and README
        run: |
          version="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = tag ] || version="$(git rev-parse --short HEAD)"
          for edition in ${{ matrix.editions }}; do
            program=aktujo; [ "$edition" = minimal ] && program=aktujo-minimal
            folder="$program-$version-${{ matrix.name }}"
            mkdir -p "pack/$folder"
            cp out/$edition/* LICENSE README.md "pack/$folder/"
            if [ "${{ runner.os }}" = Windows ]; then
              (cd pack && 7z a -tzip "$folder.zip" "$folder" >/dev/null)
            else
              tar -C pack -czf "pack/$folder.tar.gz" "$folder"
            fi
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.name }}
          path: |
            pack/*.tar.gz
            pack/*.zip

  # A draft release of the tag with every binary and their SHA-256 sums – the maintainer reads and publishes it.
  release:
    needs: [binaries, crates]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: pack
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd pack
          sha256sum *.tar.gz *.zip > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "aktujo ${GITHUB_REF_NAME#v}" \
            --notes "aktujo ${GITHUB_REF_NAME#v} – the program as \`aktujo\` (everything) and \`aktujo-minimal\` (without scanning, OCR and object stores). Check a download against SHA256SUMS." \
            *.tar.gz *.zip SHA256SUMS
