# SPDX-License-Identifier: MIT
[package]
name = "aktujo-sdk"
description = "The workspace of aktujo – a person's archive on a device: spaces, documents, kinds, reading, search, sync, export – the one layer every interface and app uses"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["document","archive","local-first","end-to-end","aktujo"]
categories = ["filesystem","database"]

[dependencies]
aktujo-base.workspace = true
aktujo-blob.workspace = true
aktujo-core.workspace = true
aktujo-crypt.workspace = true
aktujo-doc.workspace = true
aktujo-extract = { workspace = true, features = ["layer", "serde"] }
aktujo-log.workspace = true
aktujo-rules.workspace = true
aktujo-scan = { workspace = true, optional = true }
aktujo-store = { workspace = true, features = ["sqlcipher"] }
aktujo-sync.workspace = true
chacha20poly1305.workspace = true
crc32fast.workspace = true
miniz_oxide.workspace = true
hex.workspace = true
hkdf.workspace = true
image = { workspace = true, optional = true }
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true

[build-dependencies]
sha2.workspace = true

[features]
# OCR with the models built in, and improving scans; without it, text layers only (aktujo-minimal).
ocr = ["aktujo-extract/pure", "scan"]
# Improving scans and photos (aktujo-scan).
scan = ["dep:aktujo-scan", "dep:image"]

[dev-dependencies]
aktujo-relay.workspace = true
tokio.workspace = true

[lints]
workspace = true
