# SPDX-License-Identifier: MIT
[package]
name = "aktujo-extract"
description = "Text with its position from PDFs and images – text layer and OCR behind one trait, for aktujo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["ocr", "pdf", "text-extraction", "paddleocr", "aktujo"]
categories = ["text-processing", "multimedia::images"]

# docs.rs shows both backends.
[package.metadata.docs.rs]
all-features = true

[dependencies]
aktujo-base.workspace = true
aktujo-scan = { workspace = true, optional = true }
thiserror.workspace = true
serde = { workspace = true, optional = true }
hayro = { workspace = true, optional = true }
image = { workspace = true, optional = true }
tract-onnx = { workspace = true, optional = true }

[dev-dependencies]
aktujo-extract-det.workspace = true
aktujo-extract-latin.workspace = true
serde_json.workspace = true

[features]
default = ["pure"]
# Pure Rust: hayro for the text layer and rendering, PaddleOCR's PP-OCR models on tract for OCR.
pure = ["layer", "dep:aktujo-scan", "dep:image", "dep:tract-onnx"]
# The text layer of PDFs with hayro, without OCR: no tract, no models.
layer = ["dep:hayro"]
# What was read as JSON.
serde = ["dep:serde"]
# Programs on the system: pdftotext and pdftoppm (poppler-utils) and Tesseract, found at run time.
external = []

[lints]
workspace = true

[[example]]
name = "read"
required-features = ["pure"]

[[example]]
name = "measure"
required-features = ["pure"]
