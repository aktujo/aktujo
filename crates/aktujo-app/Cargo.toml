# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "aktujo-app"
description = "The workspace of aktujo: every command and query, the one layer the interfaces use"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
aktujo-base.workspace = true
aktujo-blob.workspace = true
aktujo-core.workspace = true
aktujo-crypt.workspace = true
aktujo-doc.workspace = true
aktujo-extract = { workspace = true, features = ["layer", "serde"] }
aktujo-log.workspace = true
aktujo-rules.workspace = true
aktujo-scan = { workspace = true, optional = true }
aktujo-store = { workspace = true, features = ["sqlcipher"] }
aktujo-sync.workspace = true
chacha20poly1305.workspace = true
hex.workspace = true
hkdf.workspace = true
image = { workspace = true, optional = true }
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
ureq.workspace = true

[build-dependencies]
sha2.workspace = true

[features]
# OCR with the models built in, and improving scans; without it, text layers only (aktujo-minimal).
ocr = ["aktujo-extract/pure", "scan"]
# Improving scans and photos (aktujo-scan).
scan = ["dep:aktujo-scan", "dep:image"]

[dev-dependencies]
aktujo-relay.workspace = true
tokio.workspace = true

[lints]
workspace = true
