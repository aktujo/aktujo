# SPDX-License-Identifier: AGPL-3.0-or-later
[package]
name = "aktujo"
description = "Your documents, kept safe – end to end"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["aktujo", "documents", "archive", "ocr", "end-to-end"]
categories = ["command-line-utilities"]
readme = "../../README.md"

[dependencies]
anyhow.workspace = true
clap.workspace = true
aktujo-api.workspace = true
aktujo-sdk.workspace = true
aktujo-crypt.workspace = true
aktujo-relay.workspace = true
aktujo-tui.workspace = true
aktujo-web.workspace = true
tokio.workspace = true

[features]
default = ["ocr"]
# Scanning and OCR, the models built in; without the default features the program is aktujo-minimal.
ocr = ["aktujo-sdk/ocr", "aktujo-api/scan", "aktujo-tui/scan"]

[lints]
workspace = true
