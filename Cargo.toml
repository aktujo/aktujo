# SPDX-License-Identifier: AGPL-3.0-or-later
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/aktujo/aktujo"
homepage = "https://aktujo.dev"
# Every crate is published on crates.io, the program too (job `crates` in .github/workflows/ci.yml).

# The lowest version each crate needs; Cargo.lock holds the exact ones, each the newest that is at least 14 days old
# (scripts/check-age.py; aktujo's own crates from aktujo/models excepted). Ranges, not exact versions, so that programs building the core in can resolve them with
# their own dependencies.
[workspace.dependencies]
aktujo-api = { path = "crates/aktujo-api", version = "0.4.0" }
aktujo-sdk = { path = "crates/aktujo-sdk", version = "0.4.0" }
aktujo-base = { path = "crates/aktujo-base", version = "0.4.0" }
aktujo-blob = { path = "crates/aktujo-blob", version = "0.4.0" }
aktujo-crypt = { path = "crates/aktujo-crypt", version = "0.4.0" }
aktujo-doc = { path = "crates/aktujo-doc", version = "0.4.0" }
aktujo-extract = { path = "crates/aktujo-extract", version = "0.4.0", default-features = false }
aktujo-log = { path = "crates/aktujo-log", version = "0.4.0" }
aktujo-relay = { path = "crates/aktujo-relay", version = "0.4.0" }
aktujo-rules = { path = "crates/aktujo-rules", version = "0.4.0" }
aktujo-scan = { path = "crates/aktujo-scan", version = "0.4.0" }
aktujo-core = { path = "crates/aktujo-core", version = "0.4.0" }
aktujo-store = { path = "crates/aktujo-store", version = "0.4.0" }
aktujo-sync = { path = "crates/aktujo-sync", version = "0.4.0" }
aktujo-tui = { path = "crates/aktujo-tui", version = "0.4.0" }
aktujo-web = { path = "crates/aktujo-web", version = "0.4.0" }
aktujo-locales = { path = "crates/aktujo-locales", version = "0.4.0" }
# The OCR models, from aktujo/models – a version of their own.
aktujo-extract-det = "1.0.0"
aktujo-extract-latin = "1.0.0"
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1.11.0"
chacha20poly1305 = "0.11.0"
crc32fast = "1.5.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
ed25519-dalek = "3.0.0"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
hayro = "0.8.0"
hex = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
hpke = { version = "0.14.1", default-features = false, features = ["x25519", "chacha", "alloc", "getrandom"] }
http-body-util = "0.1.5"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff"] }
keyring = "4.2.0"
miniz_oxide = "0.8.9"
postgres = "0.19.14"
# TLS to PostgreSQL: rustls with ring, the roots of the system.
rustls = { version = "0.23.20", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.3"
tokio-postgres-rustls = "0.14.0"
object_store = { version = "0.14.2", default-features = false }
ratatui = "0.30.2"
regex = "1.13.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "io-util"] }
tower = { version = "0.5.3", features = ["util"] }
tract-onnx = "0.22.5"
ureq = "3.4.2"
utoipa = { version = "6.0.0", features = ["axum_extras"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# OCR is slow unoptimised (tests read pages with it): its crates are optimised in debug builds too.
[profile.dev.package.tract-core]
opt-level = 3
[profile.dev.package.tract-data]
opt-level = 3
[profile.dev.package.tract-linalg]
opt-level = 3
[profile.dev.package.tract-onnx-opl]
opt-level = 3
[profile.dev.package.aktujo-extract]
opt-level = 3
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.tract-hir]
opt-level = 3
[profile.dev.package.tract-nnef]
opt-level = 3
[profile.dev.package.tract-onnx]
opt-level = 3
